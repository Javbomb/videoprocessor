<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Patterns</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #help {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      padding: 10px 16px; border-radius: 10px; background: rgba(40,40,40,0.9); color: #ddd;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; cursor: default;
      transition: opacity 0.4s;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="help">Click / tap or ← → to change pattern · F for fullscreen · <span id="name"></span></div>
  <script>
    // Patterns are drawn in sRGB 8-bit code values. Turn off any "vivid"/dynamic modes on
    // the projector and on the playback device so 100% white really is the projector's peak.
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const patterns = [
      ['100% white', (w, h) => fill('#fff', w, h)],
      ['0% black', (w, h) => fill('#000', w, h)],
      ['11-step grey scale', (w, h) => {
        for (let i = 0; i < 11; i++) {
          const v = Math.round((i / 10) * 255);
          ctx.fillStyle = `rgb(${v},${v},${v})`;
          ctx.fillRect(Math.floor((i * w) / 11), 0, Math.ceil(w / 11), h);
        }
      }],
      ['Ramp', (w, h) => {
        const g = ctx.createLinearGradient(0, 0, w, 0);
        g.addColorStop(0, '#000');
        g.addColorStop(1, '#fff');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      }],
      ['ANSI checkerboard', (w, h) => {
        for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
          ctx.fillStyle = (x + y) % 2 ? '#000' : '#fff';
          ctx.fillRect((x * w) / 4, (y * h) / 4, w / 4 + 1, h / 4 + 1);
        }
      }],
      ['10% white window', (w, h) => {
        fill('#000', w, h);
        const s = Math.sqrt(0.1);
        ctx.fillStyle = '#fff';
        ctx.fillRect(w * (1 - s) / 2, h * (1 - s) / 2, w * s, h * s);
      }],
    ];
    let idx = 0;
    function fill(col, w, h) { ctx.fillStyle = col; ctx.fillRect(0, 0, w, h); }
    function draw() {
      const dpr = window.devicePixelRatio || 1;
      c.width = Math.round(innerWidth * dpr);
      c.height = Math.round(innerHeight * dpr);
      patterns[idx][1](c.width, c.height);
      document.getElementById('name').textContent = patterns[idx][0];
    }
    let hideTimer;
    function showHelp() {
      const h = document.getElementById('help');
      h.style.opacity = 1;
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => (h.style.opacity = 0), 2500);
    }
    function step(d) { idx = (idx + d + patterns.length) % patterns.length; draw(); showHelp(); }
    c.addEventListener('click', () => step(1));
    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    });
    addEventListener('resize', draw);
    draw();
    showHelp();
  </script>
</body>
</html>
